name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Audit this repository with the tool it ships
        run: python agent_ready.py . --json > /dev/null

      - name: Gate on our own agent-readiness score
        if: matrix.python-version == '3.12'
        run: python agent_ready.py . --fail-under 85
